# =============================================================================
# ResourceWorldResetter v5.2.0 - Spigot / CraftBukkit
# Author: TamaWish
# =============================================================================
# Requires Java 21+ and Multiverse-Core 5.8.0+.
# Version 4 configurations are not loaded automatically. Back up your server and
# configure v5 from this fresh template.
# =============================================================================

config-version: 5

# Server-wide message locale. Use a bundled locale (en_US, zh_CN, ja_JP, or ko_KR),
# or add <locale>.yml under plugins/ResourceWorldResetter/locales/.
# Apply changes in-game with /rwr reload.
locale: en_US

# -----------------------------------------------------------------------------
# Server Defaults
# -----------------------------------------------------------------------------
# IANA timezone used by daily, weekly, and monthly schedules.
# Examples: Asia/Kuala_Lumpur, Europe/London, America/New_York
timezone: Asia/Kuala_Lumpur

# Protected local hub and legacy fallback when evacuation defaults are absent.
default-hub-world: world

# -----------------------------------------------------------------------------
# Update Checker
# -----------------------------------------------------------------------------
# Checks GitHub Releases asynchronously at startup. Disable to prevent this check.
updates:
  enabled: true
  # Timeout for the GitHub request. Accepted range: 1-60 seconds.
  request-timeout-seconds: 10
  # Notify players with rwr.admin when they join and a cached update is available.
  notify-admins-on-join: true

# -----------------------------------------------------------------------------
# Reset Policy
# -----------------------------------------------------------------------------
# Safe failures may retry automatically. Ambiguous failures always require review.
reset-policy:
  # Number of automatic retries after a safe failure. Use 0 to disable retries.
  max-safe-retries: 2
  # Delay before each safe retry.
  retry-delay-seconds: 30
  # Broadcast successful completion to online players.
  broadcast-completion: true

# -----------------------------------------------------------------------------
# Player Teleport Menu
# -----------------------------------------------------------------------------
teleport:
  # Discover registered Multiverse worlds without loading them.
  auto-discover: true
  # Default visibility for discovered worlds without an explicit override.
  default-enabled: false
  # Show permission-locked entries in the player GUI instead of hiding them.
  show-locked: true
  # Per-world overrides are stored in managed-worlds.yml.

# Typed defaults for newly added worlds and worlds without an evacuation section.
# Existing scalar destinations remain supported as local-world destinations.
evacuation:
  enabled: true
  timeout-seconds: 30 # Accepted range: 1-120 seconds.
  destination:
    type: local-world # default-world, local-world, proxy-server, registered-provider
    target: world # Ignored for default-world; provider ID for registered-provider.

# Named proxy destinations shown in /rwr gui. Manual entry is also available.
# Velocity requires bungee-plugin-message-channel=true. BungeeCord uses Connect.
proxy-servers: [] # Example: [hub, lobby, survival]
