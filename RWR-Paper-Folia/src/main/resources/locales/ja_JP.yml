# =============================================================================
# ResourceWorldResetter 日本語ロケール（Paper / Purpur / Folia）
# =============================================================================
# デフォルト＋フォールバック用ロケール。このファイルをコピーして翻訳を追加できます。
# MiniMessage に対応しています。実行時プレースホルダーは <name> 形式です。
# タグ名は変更しないでください。周囲のテキストと色は翻訳して構いません。
# 旧式の &-コードおよび %placeholders% も読み込み時に変換されます。
# =============================================================================

# -----------------------------------------------------------------------------
# プレフィックス
# -----------------------------------------------------------------------------
prefix: "<gradient:#00C9FF:#92FE9D>[RWR]</gradient> "

# -----------------------------------------------------------------------------
# コマンド
# -----------------------------------------------------------------------------
command:
  # 一般的なコマンド応答。
  no-permission: "<prefix><red>権限がありません: <permission>"
  player-only: "<prefix><red><feature> はプレイヤーのみ使用できます。"
  unknown: "<prefix><red>不明なコマンドです。/rwr help を使用してください。"
  no-worlds: "<prefix><gray>リセット対象のワールドは設定されていません。"

  # ヘルプ一覧。
  help-header: "<prefix><yellow>利用可能なコマンド:"
  help-entry: "<gray><usage> <dark_gray>- <white><description>"

  # リロードとロケール保持。
  reload-success: "<prefix><green>設定とロケールを再読み込みしました。有効なワールド数: <count>。"
  reload-failed: "<prefix><red>再読み込みは拒否されました。<retention>"
  locale-reload-failed: "<prefix><red>ロケールの再読み込みは拒否されました。以前の有効なロケールを引き続き使用します。"
  issue: "<red> - <issue>"

  # 保護付きリセット。
  reset-start: "<prefix><yellow><white><world> <dark_gray>（ID: <world_id>）<yellow> の保護付きリセットを開始します。"
  reset-success: "<prefix><green>リセット完了 [操作=<operation>]: <message>"
  reset-failed: "<prefix><red>リセット失敗 [<failure>, 安全=<safety>, 操作=<operation>]: <message>"

  # リセット履歴。
  history-count: "<prefix><red>履歴件数は 1 から 50 の整数である必要があります。"
  history-empty: "<prefix><gray>リセット履歴はありません。"
  history-header: "<prefix><gold>最近のリセット履歴 <dark_gray>（<gray><count> 件<dark_gray>）"
  history-entry: "<gold><world> <dark_gray>（<gray>ID: <world_id><dark_gray>） <white>— <phase>"
  history-time: "  <gray>完了: <white><completed> <dark_gray>| <gray>操作: <white><operation>"
  history-detail: "  <gray>結果: <white><result> <dark_gray>— <gray><message>"

  # ステータス一覧。
  status-header: "<prefix><gold><world> <dark_gray>（<gray>ID: <world_id><dark_gray>）"
  status-state: "  <gray>状態: <white><phase> <dark_gray>| <gray>プロバイダーワールド: <white><world>"
  status-schedule: "  <gray>次回リセット: <white><next>"
  status-operation: "  <gray>操作: <white><operation> <dark_gray>— <gray><message>"

  # ヘルプ説明。description 以降のキーは /rwr サブコマンドと対応します。
  description:
    help: "このヘルプを表示"
    status: "リセット状態を表示"
    gui: "管理GUIを開く"
    tp: "テレポートGUIを開く"
    reset: "保護付きリセットを要求"
    history: "リセット履歴を表示"
    reload: "設定とロケールを再読み込み"
    version: "インストール済みおよび最新の RWR バージョンを表示"
    discord: "Discord Webhook アドオンを管理"
    placeholder: "PlaceholderAPI アドオンを管理"
  feature:
    admin-gui: "管理 GUI"
    teleport-gui: "テレポート GUI"
  retention:
    previous: "以前の有効な設定を引き続き使用します。"
    none: "有効な設定はありません。"

# -----------------------------------------------------------------------------
# アップデートチェッカー
# -----------------------------------------------------------------------------
update:
  # プレイヤーおよびコマンドの応答。
  checking: "<prefix><yellow>GitHub Releases で更新を確認しています..."
  current: "<prefix><green>RWR <installed> は最新です。"
  available: "<prefix><gold>更新があります: <installed> → <latest>。<aqua><url>"
  failed: "<prefix><gray>現在アップデート確認は利用できません。RWR は通常どおり動作します。"
  disabled: "<prefix><gray>GitHub のアップデート確認は無効です。"

teleport:
  not-configured: "この行き先は無効になっているか、設定から削除されました。"
  no-permission: "この行き先へのテレポート権限がありません。"
  unavailable: "対象の Worlds ワールドは現在読み込まれていません。"
  resetting: "このワールドは現在リセット中です。"
  safe-unavailable: "現在利用できる安全な行き先がありません。"
  reset-started: "ワールドのリセットが開始されたため、テレポートをキャンセルしました。"
  failed: "テレポートに失敗しました。"
  rejected: "サーバーがテレポートを拒否しました。"
  success: "<world> にテレポートしました。"

# -----------------------------------------------------------------------------
# プレイヤー通知
# -----------------------------------------------------------------------------
notification:
  warning: "<prefix><yellow><world> は <remaining> 後にリセットされます。"
  reset-complete: "<prefix><green><world> のリセットが正常に完了しました。"
  reset-failed: "<prefix><red><world> のリセットに失敗しました: <failure>。"

