# =============================================================================
# ResourceWorldResetter English Locale (Paper / Purpur / Folia)
# =============================================================================
# Default + fallback locale. Copy this file to add translations.
# MiniMessage is supported. Runtime placeholders use the <name> form.
# Keep tag names unchanged; surrounding text and colors may be translated.
# Legacy &-codes and %placeholders% are still accepted and converted on load.
# =============================================================================

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------
prefix: "<gradient:#00C9FF:#92FE9D>[RWR]</gradient> "

# -----------------------------------------------------------------------------
# Commands
# -----------------------------------------------------------------------------
command:
  # General command responses.
  no-permission: "<prefix><red>You do not have permission: <permission>"
  player-only: "<prefix><red>The <feature> can only be used by a player."
  unknown: "<prefix><red>Unknown command. Use /rwr help."
  no-worlds: "<prefix><gray>No reset worlds are configured."

  # Help listing.
  help-header: "<prefix><yellow>Available commands:"
  help-entry: "<gray><usage> <dark_gray>- <white><description>"

  # Reload and locale retention.
  reload-success: "<prefix><green>Configuration and locale reloaded. Active worlds: <count>."
  reload-failed: "<prefix><red>Reload rejected; <retention>"
  locale-reload-failed: "<prefix><red>Locale reload rejected; the previous valid locale remains active."
  issue: "<red> - <issue>"

  # Guarded reset.
  reset-start: "<prefix><yellow>Starting guarded reset for <white><world> <dark_gray>(ID: <world_id>)<yellow>."
  reset-success: "<prefix><green>Reset complete [operation=<operation>]: <message>"
  reset-failed: "<prefix><red>Reset failed [<failure>, safety=<safety>, operation=<operation>]: <message>"

  # Reset history.
  history-count: "<prefix><red>History count must be an integer from 1 through 50."
  history-empty: "<prefix><gray>Reset history is empty."
  history-header: "<prefix><gold>Recent reset history <dark_gray>(<gray><count> entries<dark_gray>)"
  history-entry: "<gold><world> <dark_gray>(<gray>ID: <world_id><dark_gray>) <white>— <phase>"
  history-time: "  <gray>Completed: <white><completed> <dark_gray>| <gray>Operation: <white><operation>"
  history-detail: "  <gray>Result: <white><result> <dark_gray>— <gray><message>"

  # Status listing.
  status-header: "<prefix><gold><world> <dark_gray>(<gray>ID: <world_id><dark_gray>)"
  status-state: "  <gray>State: <white><phase> <dark_gray>| <gray>Provider world: <white><world>"
  status-schedule: "  <gray>Next reset: <white><next>"
  status-operation: "  <gray>Operation: <white><operation> <dark_gray>— <gray><message>"

  # Help descriptions. Keys after description. match /rwr subcommands.
  description:
    help: "Show this help"
    status: "Show reset status"
    gui: "Open the administration GUI"
    tp: "Open the teleport GUI"
    reset: "Request a guarded reset"
    history: "Show reset history"
    reload: "Reload configuration and locale"
    version: "Show installed and latest RWR versions"
    discord: "Manage the Discord webhook add-on"
    placeholder: "Manage the PlaceholderAPI add-on"
  feature:
    admin-gui: "administration GUI"
    teleport-gui: "teleport GUI"
  retention:
    previous: "the previous valid configuration remains active."
    none: "no configuration is active."

# -----------------------------------------------------------------------------
# Update Checker
# -----------------------------------------------------------------------------
update:
  # Player and command responses.
  checking: "<prefix><yellow>Checking GitHub Releases for updates..."
  current: "<prefix><green>RWR <installed> is up to date."
  available: "<prefix><gold>Update available: <installed> → <latest>. <aqua><url>"
  failed: "<prefix><gray>The update check is currently unavailable; RWR continues normally."
  disabled: "<prefix><gray>GitHub update checking is disabled."

# -----------------------------------------------------------------------------
# Teleport Outcomes
# -----------------------------------------------------------------------------
teleport:
  not-configured: "That destination is disabled or no longer configured."
  no-permission: "You do not have permission for that destination."
  unavailable: "That Worlds world is not currently loaded."
  resetting: "That world is currently resetting."
  safe-unavailable: "No safe destination is currently available."
  reset-started: "That world started resetting; teleport cancelled."
  failed: "Teleport failed."
  rejected: "The server rejected the teleport."
  success: "Teleported to <world>."

# -----------------------------------------------------------------------------
# Player Notifications
# -----------------------------------------------------------------------------
notification:
  warning: "<prefix><yellow><world> will reset in <remaining>."
  reset-complete: "<prefix><green><world> reset completed successfully."
  reset-failed: "<prefix><red><world> reset failed: <failure>."

